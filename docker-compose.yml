services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskly-system-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskly-system

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskly-system-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - taskly-system

  nginx:
    image: nginx:alpine
    container_name: taskly-system-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - taskly-system

  postgres:
    image: postgres:16-alpine
    container_name: taskly-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskly_system
      POSTGRES_USER: taskly_system
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly_system -d taskly_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskly-system

volumes:
  postgres_data:

networks:
  taskly-system:
    driver: bridge
