services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskly-system-app
    command: sh -c "mkdir -p /var/www/html/storage/app/private /var/www/html/storage/framework/cache /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/bootstrap/cache && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && find /var/www/html/storage /var/www/html/bootstrap/cache -type d -exec chmod 0770 {} + && find /var/www/html/storage /var/www/html/bootstrap/cache -type f -exec chmod 0660 {} + && exec php-fpm"
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    environment:
      - APP_ENV=local
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taskly-system

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskly-system-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://nginx
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - taskly-system

  nginx:
    image: nginx:alpine
    container_name: taskly-system-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - taskly-system

  postgres:
    image: postgres:16-alpine
    container_name: taskly-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskly_system
      POSTGRES_USER: taskly_system
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly_system -d taskly_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskly-system

volumes:
  postgres_data:
  backend_vendor:
  backend_storage:

networks:
  taskly-system:
    driver: bridge
